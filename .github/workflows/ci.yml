name: CI/CD Pipeline for TourGuide

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev


jobs:
  build:
    # Utilisation d'un runner macOS
    runs-on: macos-latest

    steps:
      # Étape 1 : Cloner le dépôt
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2.1 : Installer et configurer le JDK 17 (Temurin) avec cache Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

       # Étape 2.2 : Installer et configurer de maven   

      # Étape 3 : Installer manuellement les dépendances locales
      # Utilisation de chemins relatifs (le dossier libs doit être à la racine du projet)
      - name: Install local JAR dependencies
        run: |
          mvn install:install-file -Dfile=libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn install:install-file -Dfile=libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar
          mvn install:install-file -Dfile=libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar

      # Étape 4.1 : Compiler le projet 
      - name: Compile project
        run: mvn compile --batch-mode

       # Étape 4.2 : exécuter les tests unitaires
      - name: Run tests with Maven
        run: mvn test --batch-mode

      # Étape 5 : Packager l'artefact (création du JAR exécutable)
      - name: Package Artifact
        run: mvn package --batch-mode

      # Étape 6 : Uploader l’artefact généré (les JARs dans le dossier target)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: tourguide-artifact
          path: target/*.jar
